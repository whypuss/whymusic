<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <!--
      不要快取這個入口檔。
      JS/CSS 的檔名帶內容雜湊（換版必換名），本來就不會拿到舊的；但 index.html
      的檔名固定，一旦被快取住，它引用的就永遠是舊那組雜湊檔名 —— 換版等於沒換。

      這在 APK 上是實際踩到的故障：更新 APK 之後 WebView 仍從快取讀 index.html，
      畫面還是舊版前端（靠「設置」頁的建置戳記才發現：APK 是新的、畫面是舊的）。
      網頁版由伺服器送 Cache-Control 處理，APK 沒有伺服器，只能靠這個 meta。
    -->
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <!-- 512x512 是 Chrome for Android 媒體通知的目標尺寸：曲目沒有封面時，
         通知欄與鎖定畫面會退回用這張圖 -->
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon-512.png" />
    <!--
      viewport-fit=cover：讓版面延伸到 iPhone 的圓角/劉海區，配合 CSS 的
      env(safe-area-inset-*) 才能真正填滿手機螢幕。
      maximum-scale=1 + user-scalable=no：避免點輸入框時 iOS Safari 自動放大，
      放大後版面會被推歪。
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <!--
      Web App Manifest：讓這個站可以「加到主畫面」變成獨立應用。
      做這件事的原因不是為了好看 —— 國產 Android ROM（vivo FuntouchOS、
      OnePlus ColorOS…）對「瀏覽器裡的網頁」和「已安裝的應用」是兩套待遇：
      實測一台一加通知欄有媒體通知但鎖屏沒有、一台 vivo 兩邊都沒有，而同樣的
      程式在 iOS 上鎖屏正常，可見 MediaSession 本身沒問題，卡在 ROM 的通知與
      後台策略。裝成獨立應用後它有自己的通知身分，鎖屏媒體控制的成功率高得多。
      網頁端沒有任何 API 能覆寫系統的鎖屏通知設定，這是唯一還剩的槓桿。
    -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <!--
      刻意沒有 apple-mobile-web-app-capable。
      實測：iOS 加到主畫面、以獨立模式（standalone）開啟後，鎖屏就播不下去；直接用
      Safari 反而完全正常。iOS 的獨立模式對背景音訊的支援一直很差，被切走或鎖屏時
      比 Safari 裡的頁面凍結得兇得多。對一個音樂播放器來說背景播放就是本體，所以
      iOS 不該進獨立模式 —— 讓「加到主畫面」只做成一個開 Safari 的捷徑。
      iOS 16.4 之後 Safari 也會讀 manifest 的 display，那條路在 main.tsx 裡處理
      （只有 iOS 會把 manifest 連結移掉，Android 需要它才能安裝）。
    -->
    <meta name="apple-mobile-web-app-title" content="WhyMusic" />
    <link rel="apple-touch-icon" href="/favicon-192.png" />
    <title>WhyMusic</title>
    <style>
      /*
        手機瀏覽器的 100vh 含網址欄高度，實際可見區更矮，版面底部會被裁掉。
        dvh 是「動態視窗高度」，會隨網址欄收合改變，才是手機上正確的滿版。
        用 CSS 變數讓不支援 dvh 的舊瀏覽器仍退回 vh。
      */
      :root { --app-height: 100vh; }
      @supports (height: 100dvh) {
        :root { --app-height: 100dvh; }
      }
      html, body, #root {
        height: var(--app-height);
        margin: 0;
        overflow: hidden;
      }
      body {
        /* 過度滑動時露出的底色，避免出現白邊 */
        background: #000;
        -webkit-font-smoothing: antialiased;
        /* 關掉 iOS 點擊時的灰色高亮塊 */
        -webkit-tap-highlight-color: transparent;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
